# cargo-mutants (copied from iemmixer @ 22372bc; iemmixer-only excludes
# dropped): the PR gate in .github/workflows/ci.yml is diff-scoped, its shard
# count computed by the `mutants-list` job from the diff's mutant count; the
# full sweep is .github/workflows/mutation-full.yml (on demand). Both pass
# --copy-target=true after a warm-up build and --timeout 60 (with
# --baseline=skip there is no measured test time, so a hung mutant would
# otherwise hold its job for 300 s). Tests run per package only. A mutant
# caught only by a timeout is tested again by scripts/mutants_recheck.py.
profile = "mutants"
test_tool = "nextest"

exclude_globs = [
  # Windows-only DPAPI calls (copied from iemmixer): not compiled on the
  # Linux runners; the `windows` CI job builds them and runs the `pepper::`
  # tests against them.
  "crates/fohmixer-hub/src/pepper/dpapi.rs",
]

exclude_re = [
  # The WASM entry point mounts the app into the browser DOM (web_sys): a
  # native test cannot run it. e2e/tests/app-load.spec.ts drives it (the app
  # mounts and the loading shell goes).
  "fohmixer-ui/src/lib\\.rs.*replace main with \\(\\)",
  # Leptos component bodies: a PascalCase function is a component, and native
  # tests cannot mount one (web_sys panics off wasm). Their pure logic lives
  # in tested helpers (version_text); the E2E suite drives the components.
  "fohmixer-ui/src/.* in [A-Z][A-Za-z]*$",
  # The panic hook's browser-only wrappers: installing the hook, rendering the
  # overlay into document.body and the fire-and-forget fetch need a browser.
  # Their logic is the tested build_overlay_html, format_panic_payload,
  # truncate_for_display and html_escape.
  "fohmixer-ui/src/lifecycle\\.rs.*replace (install_panic_hook|render_panic_overlay|post_panic_report) with \\(\\)",
  # Takes a PanicHookInfo, which only a real panic hook receives; its body is
  # the tested format_panic_payload.
  "fohmixer-ui/src/lifecycle\\.rs.*replace format_panic_message -> String with ",
  # S4 (#8): the UI's browser glue. web-sys calls panic off wasm, so a native
  # test cannot run these; each carries out decisions made by the tested pure
  # modules (behave/*, binding, stage, net, raf's Registry, the store's Slot,
  # Readiness, Wanted, Badge, slot_failure, range_from, next_range and store/conn.rs's
  # Conn, replaces and instance_change), and the E2E suite drives every one
  # of them in Chromium and WebKit.
  # dom.rs: the clocks, style/attribute writes, the console, local storage.
  "fohmixer-ui/src/dom\\.rs.*(replace|in) (now|wall_now|log|error|set_style|set_attr|viewport|current_element|child|storage|storage_get|storage_set|storage_remove)( |$)",
  # net.rs: the fetch wrapper and the handshake reload (location.reload).
  "fohmixer-ui/src/net\\.rs.*(replace|in) (fetch_text|last_reload|reload)( |$)",
  # raf.rs: requestAnimationFrame scheduling around the tested Registry, and
  # a component's registration of its frame function.
  "fohmixer-ui/src/raf\\.rs.*(replace|in) (register|unregister|schedule|tick|animate)( |$)",
  # store/live.rs: the WebSocket, its handlers and the timers, the signals and
  # the fetches that carry out Conn's decisions, one function at a time.
  "fohmixer-ui/src/store/live\\.rs.*(replace|in) LiveStore::(new|start|stop|stopped|token|logout|connect|retry|show_layout|open_socket|watch|drop_socket|on_close|on_text|on_hello|on_instance|on_layout|apply|mark_pending|send|send_sub|slot|slot_signal|set_wanted|refresh|cmd|finish|set_prop|set_hub|range|fetch_ranges|fetch_range)( |$)",
  "fohmixer-ui/src/store/live\\.rs.*(replace|in) (Socket::open|Socket::close|Inner::new)( |$)",
  # auth.rs: local storage and the login request (login_outcome, login_body
  # and LoginError::message are the tested decisions).
  "fohmixer-ui/src/auth\\.rs.*(replace|in) (stored_token|login)( |$)",
  # app.rs: the address bar (history.replaceState); page_path is tested.
  "fohmixer-ui/src/app\\.rs.*(replace|in) show_path( |$)",
  # components: the failure flash (a timer) and a flag write through the
  # store.
  "fohmixer-ui/src/components/mod\\.rs.*(replace|in) fail_flash( |$)",
  "fohmixer-ui/src/components/buttons\\.rs.*(replace|in) toggle_flag( |$)",
  # pages/surface.rs: a tab press (store, local storage) and the remembered
  # pages' read; choose and selected_path are the tested decisions.
  "fohmixer-ui/src/pages/surface\\.rs.*(replace|in) (Nav::select|remembered_pages)( |$)",
]
