# cargo-mutants (copied from iemmixer @ 22372bc; iemmixer-only excludes
# dropped): the PR gate in .github/workflows/ci.yml is diff-scoped, its shard
# count computed by the `mutants-list` job from the diff's mutant count; the
# full sweep is .github/workflows/mutation-full.yml (on demand). Both pass
# --copy-target=true after a warm-up build and --timeout 60 (with
# --baseline=skip there is no measured test time, so a hung mutant would
# otherwise hold its job for 300 s). Tests run per package only. A mutant
# caught only by a timeout is tested again by scripts/mutants_recheck.py.
profile = "mutants"
test_tool = "nextest"

exclude_globs = [
  # Windows-only DPAPI calls (copied from iemmixer): not compiled on the
  # Linux runners; the `windows` CI job builds them and runs the `pepper::`,
  # `sealed::` and `cf_token::` tests against them.
  "crates/fohmixer-hub/src/dpapi.rs",
  # The tray's Windows-only Tauri glue (#39, as iemmixer excludes iem-tray):
  # not compiled on the Linux runners; the `windows` CI job builds and lints
  # it, and Test-Fohmixer.ps1 runs the exe (start, `--exit`, the log). Its
  # decisions are the tested args, links, poll and view modules.
  "crates/fohmixer-tray/src/tray.rs",
  # The tray's entry point: on Windows it calls tray::run, elsewhere it only
  # says the tray is Windows-only.
  "crates/fohmixer-tray/src/main.rs",
]

exclude_re = [
  # The WASM entry point mounts the app into the browser DOM (web_sys): a
  # native test cannot run it. e2e/tests/app-load.spec.ts drives it (the app
  # mounts and the loading shell goes).
  "fohmixer-ui/src/lib\\.rs.*replace main with \\(\\)",
  # Leptos component bodies: a PascalCase function is a component, and native
  # tests cannot mount one (web_sys panics off wasm). Their pure logic lives
  # in tested helpers (version_text); the E2E suite drives the components.
  "fohmixer-ui/src/.* in [A-Z][A-Za-z]*$",
  # The panic hook's browser-only wrappers: installing the hook, rendering the
  # overlay into document.body and the fire-and-forget fetch need a browser.
  # Their logic is the tested build_overlay_html, format_panic_payload,
  # truncate_for_display and html_escape.
  "fohmixer-ui/src/lifecycle\\.rs.*replace (install_panic_hook|render_panic_overlay|post_panic_report) with \\(\\)",
  # Takes a PanicHookInfo, which only a real panic hook receives; its body is
  # the tested format_panic_payload.
  "fohmixer-ui/src/lifecycle\\.rs.*replace format_panic_message -> String with ",
  # S4 (#8): the UI's browser glue. web-sys calls panic off wasm, so a native
  # test cannot run these; each carries out decisions made by the tested pure
  # modules (behave/*, binding, flow, net, raf's Registry, the store's Slot,
  # Readiness, Wanted, Badge, slot_failure, range_from, next_range and store/conn.rs's
  # Conn, replaces and instance_change), and the E2E suite drives every one
  # of them in Chromium and WebKit.
  # dom.rs: the clocks, style/attribute writes, the viewport, the console,
  # local storage.
  # #43 PR D added event_epoch (a browser event's timeStamp on the page
  # clock: performance.timeOrigin plus Event.timeStamp).
  "fohmixer-ui/src/dom\\.rs.*(replace|in) (now|epoch_now|event_epoch|hidden|wall_now|log|error|set_style|set_attr|remove_attr|viewport|current_element|child|storage|storage_get|storage_set|storage_remove)( |$)",
  # net.rs: the fetch wrapper and the handshake reload (location.reload).
  "fohmixer-ui/src/net\\.rs.*(replace|in) (fetch_text|last_reload|reload)( |$)",
  # raf.rs: requestAnimationFrame scheduling around the tested Registry, and
  # a component's registration of its frame function.
  "fohmixer-ui/src/raf\\.rs.*(replace|in) (register|unregister|schedule|tick|animate)( |$)",
  # store/live.rs: the WebSocket, its handlers and the timers, the signals and
  # the fetches that carry out Conn's decisions, one function at a time. #43
  # added set (a control's write through the tested Intents), on_ack (an ack
  # through Intents::ack to the control's failure flash), send_reports
  # (the dropout watch's reports as a trace, behave::link::trace) and
  # tick_link (the dropout watch's timer); the E2E suite drives them
  # (link.spec.ts: a fader drag's sets and acks, a held link and a lost
  # socket reported as dropouts, and a socket lost during a page stall,
  # which only the timer going on between sockets counts). PR B added
  # mark_stale (each wanted slot through the tested Slot::into_stale),
  # set_wanted through the tested Slot::rewanted, forget_unwanted (a
  # hello's unwanted slots back to Pending) and apply's drop of a late value
  # for a key no page wants, both through the tested Conn::wants
  # (resilience.spec.ts: a page switched during an outage keeps its values;
  # one left while connected or across a reconnect comes back waiting, and
  # so does one whose late value arrived after it went), and moved the
  # write glue to store/live/writes.rs (below).
  # PR C moved tick_link to store/live/link.rs (below), replaced
  # send_reports with the flight recorder's upload there, and split send's
  # socket write into send_text (also the recorder's batches).
  "fohmixer-ui/src/store/live\\.rs.*(replace|in) LiveStore::(new|start|stop|stopped|token|logout|connect|retry|show_layout|open_socket|watch|drop_socket|on_close|on_text|on_hello|on_instance|on_layout|apply|mark_pending|mark_stale|forget_unwanted|send|send_text|send_sub|slot|slot_signal|set_wanted|refresh|cmd|finish|set_prop|set_hub|range|fetch_ranges|fetch_range)( |$)",
  # store/live/link.rs (#43 PR C): the link's glue, one function at a time:
  # tick_link (the dropout watch's 100 ms timer), collect_dropouts (the
  # watch's finished reports into the flight recorder), upload (the
  # recorder's due batch onto the socket: Recorder::upload with the socket's
  # readiness and bufferedAmount and Conn::next_ping), reset_dropouts (the
  # counter's tap through DropoutWatch::reset) and show_counter (the
  # counter's signal from DropoutWatch::counter). Their decisions are the
  # tested DropoutWatch (counter, reset) and Recorder (upload, proved,
  # requeue, soon); counter.spec.ts drives them (the counter red during an
  # impair stall and a cut link, back to neutral, a tap to 0, and the
  # page's trace records, the backlog after a reconnect, in the event log).
  "fohmixer-ui/src/store/live/link\\.rs.*(replace|in) LiveStore::(tick_link|collect_dropouts|upload|reset_dropouts|show_counter)( |$)",
  # store/live/writes.rs (#43): the controls' writes between the controls,
  # the tested Intents and the socket, one function at a time: on_ack (an ack
  # through Intents::ack to the control's failure flash), resend
  # (Intents::resend's sets onto the socket, on conn::back_online), set,
  # release and touch (Intents::set, release and touch with the page clock),
  # intent_view (Intents::state and open), and
  # live_value (Intents::live_value on store::write_key of a subscription);
  # link.spec.ts and resilience.spec.ts drive them (acked sets; a release
  # kept across a dropped link, a touch while it reconnects, a release inside
  # a stall, a release too old to send again, a fader rebuilt with its write
  # open; live_value: a not-sent release Live already holds is confirmed;
  # release: a fader taken away under a finger; touch: a pan touched again
  # while its write waits).
  # PR C added intent_state (Intents::state for a pan's or a toggle's look;
  # intent.spec.ts reads the outlines) and the recorder's send and ack
  # events (trace::send / trace::ack, tested).
  # PR D added sent_set (a set onto the socket: Recorder::set_went when the
  # socket took it, the tested trace::send event when it did not) and set's
  # sequence number (trace::seq_of, tested); recorder.spec.ts counts the
  # recorder's batches that reach the hub while a drag's sets do (at most 2;
  # the page events between its first and last set, asserted at least 4
  # batches' worth, would send at least 3 without the gate) and compares the
  # sets' delay with and without the recorder.
  # PR E dropped the send and ack events (the hub's records hold them) and
  # added note_intents (Intents::changes, tested, into the tested
  # trace::intent event with the page clock), run from the link's tick, at
  # the end of resend and at the start of on_ack, set and touch, so a turn
  # is recorded before a write closes or resets; intent.spec.ts reads the
  # pan's and the mute's unconfirmed and not_sent records back from the
  # event log, resilience.spec.ts a not_sent write Live's replayed value
  # closes within milliseconds.
  "fohmixer-ui/src/store/live/writes\\.rs.*(replace|in) LiveStore::(on_ack|resend|set|sent_set|release|touch|intent_state|intent_view|live_value|note_intents)( |$)",
  "fohmixer-ui/src/store/live\\.rs.*(replace|in) (Socket::open|Socket::buffered|Socket::close|Inner::new)( |$)",
  # auth.rs: local storage and the login request (login_outcome, login_body
  # and LoginError::message are the tested decisions).
  "fohmixer-ui/src/auth\\.rs.*(replace|in) (stored_token|login)( |$)",
  # app.rs: the address bar (history.replaceState); page_path is tested.
  "fohmixer-ui/src/app\\.rs.*(replace|in) show_path( |$)",
  # components: the failure flash (a timer) and a flag write through the
  # store.
  "fohmixer-ui/src/components/mod\\.rs.*(replace|in) fail_flash( |$)",
  # components (#43 PR C): trace_touch (a touch into the page's flight
  # recorder with the page clock; trace::touch is tested) and intent_look
  # (a toggle's frame function writing data-intent; most_urgent and
  # State::name are tested); intent.spec.ts and counter.spec.ts drive them.
  # PR D added trace_start (a fader's or pan's taken down with where it
  # started, moves::touch_start, tested, with the page clock) and trace_move
  # (a frame's moves, the tested Trail::take, into the recorder, a touch's
  # first ones essential); forensics.spec.ts reads both back from the event
  # log.
  "fohmixer-ui/src/components/mod\\.rs.*(replace|in) (trace_touch|trace_start|trace_move|intent_look)( |$)",
  "fohmixer-ui/src/components/buttons\\.rs.*(replace|in) toggle_flag( |$)",
  # pages/surface.rs: a tab press (store, local storage) and the remembered
  # pages' read; choose and selected_path are the tested decisions.
  "fohmixer-ui/src/pages/surface\\.rs.*(replace|in) (Nav::select|remembered_pages)( |$)",
  # diag.rs (#26), one browser call each: install (the window error,
  # unhandledrejection and visibilitychange listeners), observe_attributes
  # (the MutationObserver on data-sw / data-wake-lock), connected and
  # disconnected (the store's hooks), report and report_error (the
  # listeners' entry points), send (the thread-local state, the page clock),
  # arm_trailing and fire_trailing (a trailing report's timer), post_report
  # and read_env (matchMedia, navigator.standalone, screen, the <html>
  # attributes), rejection_text (a JS reason as text) and post (the
  # keepalive fetch). Their decisions are the tested Diag (offer/fire:
  # throttle, trailing reports, waiting errors; hellos), Conn::closed (which
  # close is a lost connection), fields, display_mode, screen_text,
  # visibility, error_event_text and attribute_kind;
  # e2e/tests/client-report.spec.ts drives the glue (load, connected,
  # disconnected, reconnect, visibility, error, rejection, sw, wake lock and
  # its trailing report).
  "fohmixer-ui/src/diag\\.rs.*(replace|in) (install|observe_attributes|connected|disconnected|report|report_error|send|arm_trailing|fire_trailing|post_report|read_env|rejection_text|post)( |$)",
  # diag.rs, the perf report's glue (#5, K4), one browser call each:
  # listen_pointers (the window's capture-phase pointerdown, pointerup and
  # pointercancel listeners), pointer_down and pointer_up (a PointerEvent's
  # id, type and primary flag read into the thread-local Perf), pause_perf
  # (the visibilitychange listener's call into it) and frame (raf::tick's
  # call with each frame's gap, on the page clock, the report sent when
  # Perf says it is due). Their decisions are diag/perf.rs's tested Perf (frame, pause,
  # down, up, report), window_full, fps, perf_due and PerfReport::fill;
  # e2e/tests/client-report.spec.ts drives the glue (a perf report with its
  # frame rate and longest frame; after a visibilitychange a touch report
  # has no frame rate yet; dispatched touch pointers report at once, a
  # cancelled and a lifted one are not counted: touches_max 3, then 4).
  "fohmixer-ui/src/diag\\.rs.*(replace|in) (listen_pointers|pointer_down|pointer_up|pause_perf|frame)( |$)",
  # diag.rs, the flight recorder's glue (#43 PR C): record and with_trace
  # (the page's one Recorder in a thread-local) and trace_visibility (the
  # visibilitychange listener's call with the page clock and
  # document.hidden). The decisions are diag/trace.rs's tested Recorder;
  # counter.spec.ts reads the page's events back from the hub's event log.
  # PR D added record_essential (an event pushed as essential into the same
  # thread-local Recorder; push_essential is tested).
  "fohmixer-ui/src/diag\\.rs.*(replace|in) (record|record_essential|with_trace|trace_visibility)( |$)",
]
