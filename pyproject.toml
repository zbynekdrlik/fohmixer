# Python tooling only (the FohMixer Live script, SimLive and the CI scripts);
# the product is the Rust workspace. Live 12 embeds Python 3.11.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# An explicit rule set, so a ruff release that changes its defaults does not
# change the gate. No pep8-naming: Live's module names (`Live`, `_Framework`,
# `ControlSurface`) and the script's folder name (`FohMixer`) are fixed by Live.
select = ["E4", "E7", "E9", "F", "W", "B"]
