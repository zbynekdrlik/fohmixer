[workspace]
members = ["crates/fohmixer-proto", "crates/fohmixer-hub", "crates/fohmixer-ui", "crates/fohmixer-tray"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.44"
edition = "2024"
authors = ["fohmixer contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zbynekdrlik/fohmixer"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# DIAGNOSTIC (#63, to be removed): reactive_graph's debug checks in the
# release build, so a "reactive value that has already been disposed" panic
# names the signal's definition and its reader.
[profile.release.package.reactive_graph]
debug-assertions = true

[profile.dev]
opt-level = 1

[profile.mutants]
inherits = "test"
debug = "none"
