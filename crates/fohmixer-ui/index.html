<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>fohmixer</title>
    <link data-trunk rel="css" href="style.css" />
    <!-- data-integrity="none": Chrome ignores `integrity` on the `as="fetch"`
         WASM preload and warns in the console (crbug.com/981419); the assets
         are same-origin, so SRI adds nothing here. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" data-integrity="none" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
    <noscript>This app requires JavaScript and WebAssembly to run.</noscript>
    <div id="app-shell">
        <style>
            #app-shell {
                position: fixed; inset: 0;
                background: #000000; color: #e0e0e0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                z-index: 9999;
            }
            #app-shell h1 {
                font-size: 1.2rem; letter-spacing: 0.15em;
                margin-bottom: 2rem; text-transform: uppercase;
            }
            .shell-spinner {
                width: 40px; height: 40px;
                border: 3px solid rgba(255,255,255,0.15);
                border-top-color: #4fc3f7;
                border-radius: 50%;
                animation: shell-spin 0.8s linear infinite;
            }
            .shell-error {
                max-width: 20rem; padding: 0 1rem;
                text-align: center; line-height: 1.5;
            }
            .shell-error button {
                margin-top: 1rem; padding: 0.6rem 1.6rem;
                border: 0; border-radius: 6px;
                background: #4fc3f7; color: #000000;
                font: inherit; font-weight: 600; cursor: pointer;
            }
            @keyframes shell-spin { to { transform: rotate(360deg); } }
        </style>
        <h1>fohmixer</h1>
        <div class="shell-spinner"></div>
        <div class="shell-error" id="shell-error" data-testid="load-error" hidden>
            <p>The mixer did not load.<br />Make sure this device is on the same network as the Ableton PC.</p>
            <button type="button" id="shell-retry">Try Again</button>
        </div>
    </div>
    <script>
    // No service worker (spec R5: v1 is LAN-only without one).
    // The app's code did not arrive (the loader in Trunk.toml calls this: the
    // WiFi dropped, or the page was left while it loaded). The shell says so
    // and offers a reload instead of spinning forever; a log line, not an
    // error: the page shows the failure itself.
    window.fohmixerLoadFailed = function (error) {
        console.log('[load] the app did not load: ' + error);
        document.querySelector('#app-shell .shell-spinner').hidden = true;
        document.getElementById('shell-error').hidden = false;
    };
    document.getElementById('shell-retry').addEventListener('click', function () {
        location.reload();
    });
    </script>
</body>
</html>
