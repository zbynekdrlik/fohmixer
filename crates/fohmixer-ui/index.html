<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>fohmixer</title>
    <!-- The stylesheets in cascade order (style.css says what each holds). -->
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="css" href="buttons.css" />
    <link data-trunk rel="css" href="strip.css" />
    <link data-trunk rel="css" href="states.css" />
    <link data-trunk rel="css" href="intent.css" />
    <!-- data-integrity="none": Chrome ignores `integrity` on the `as="fetch"`
         WASM preload and warns in the console (crbug.com/981419); the assets
         are same-origin, so SRI adds nothing here. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" data-integrity="none" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-dir" href="icons" />
    <!-- The fonts ship with the app (the mixer works on the LAN without the
         internet, D7): Barlow, Barlow Condensed, JetBrains Mono (OFL). -->
    <link data-trunk rel="copy-dir" href="fonts" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- use-credentials: behind Cloudflare Access (the tunnel, #17) the
         manifest's fetch must carry the Access cookie or it gets the login
         page instead. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#07070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
    <noscript>This app requires JavaScript and WebAssembly to run.</noscript>
    <div id="app-shell">
        <style>
            #app-shell {
                position: fixed; inset: 0;
                background: #000000; color: #e0e0e0;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                z-index: 9999;
            }
            #app-shell h1 {
                font-size: 1.2rem; letter-spacing: 0.15em;
                margin-bottom: 2rem; text-transform: uppercase;
            }
            .shell-spinner {
                width: 40px; height: 40px;
                border: 3px solid rgba(255,255,255,0.15);
                border-top-color: #4fc3f7;
                border-radius: 50%;
                animation: shell-spin 0.8s linear infinite;
            }
            .shell-error {
                max-width: 20rem; padding: 0 1rem;
                text-align: center; line-height: 1.5;
            }
            .shell-error button {
                margin-top: 1rem; padding: 0.6rem 1.6rem;
                border: 0; border-radius: 6px;
                background: #4fc3f7; color: #000000;
                font: inherit; font-weight: 600; cursor: pointer;
            }
            @keyframes shell-spin { to { transform: rotate(360deg); } }
        </style>
        <h1>fohmixer</h1>
        <div class="shell-spinner"></div>
        <div class="shell-error" id="shell-error" data-testid="load-error" hidden>
            <p>The mixer did not load.<br />Make sure this device is on the same network as the Ableton PC.</p>
            <button type="button" id="shell-retry">Try Again</button>
        </div>
    </div>
    <script>
    // Remote access (#17, spec R5): on the https origin (the public name, on
    // the LAN or through the tunnel) the page is an installable PWA — a
    // network-only service worker (sw.js: never a cached answer, everything
    // sits behind Cloudflare Access on the internet path) — and holds a
    // Screen Wake Lock while it is visible, taken again whenever the page
    // comes back (the system drops it when the page is hidden) or a touch
    // ends while none is held (iPadOS wants a touch, #5 K4). The
    // emergency plain-http path (http://<PC>:8480) stays without either;
    // http://127.0.0.1 is a secure context too, so the test is the scheme.
    // data-pwa / data-wake-lock on <html> say what happened (E2E, support).
    (function () {
        var root = document.documentElement;
        if (location.protocol !== 'https:') {
            root.dataset.pwa = 'off';
            return;
        }
        root.dataset.pwa = 'on';
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                root.dataset.sw = 'registered';
            }, function (error) {
                root.dataset.sw = 'failed';
                console.log('[pwa] service worker not registered: ' + error);
            });
        } else {
            root.dataset.sw = 'unsupported';
        }
        var lock = null;
        var asking = false;
        // Written only when it changes: the app reports every write of it
        // to the hub (diag.rs), and a touch may ask again with the same
        // answer (unsupported, denied).
        function show(state) {
            if (root.dataset.wakeLock !== state) root.dataset.wakeLock = state;
        }
        function acquire() {
            if (!('wakeLock' in navigator)) {
                show('unsupported');
                return;
            }
            if (document.visibilityState !== 'visible' || lock !== null || asking) return;
            asking = true;
            navigator.wakeLock.request('screen').then(function (sentinel) {
                asking = false;
                lock = sentinel;
                show('held');
                sentinel.addEventListener('release', function () {
                    lock = null;
                    show('released');
                });
            }, function (error) {
                asking = false;
                show('denied');
                console.log('[pwa] wake lock not granted: ' + error);
            });
        }
        document.addEventListener('visibilitychange', acquire);
        // iPadOS grants the lock only with user activation, so it refuses
        // the requests at load and on visibilitychange; for a finger the
        // activation is the end of the touch, not its pointerdown (#5 K4).
        // So the end of every touch asks again while no lock is held;
        // every fader drag ends in one too.
        document.addEventListener('pointerup', function () {
            if (lock === null) acquire();
        }, { capture: true, passive: true });
        acquire();
    })();
    // The app's code did not arrive (the loader in Trunk.toml calls this: the
    // WiFi dropped, or the page was left while it loaded). The shell says so
    // and offers a reload instead of spinning forever; a log line, not an
    // error: the page shows the failure itself.
    window.fohmixerLoadFailed = function (error) {
        console.log('[load] the app did not load: ' + error);
        document.querySelector('#app-shell .shell-spinner').hidden = true;
        document.getElementById('shell-error').hidden = false;
    };
    document.getElementById('shell-retry').addEventListener('click', function () {
        location.reload();
    });
    </script>
</body>
</html>
