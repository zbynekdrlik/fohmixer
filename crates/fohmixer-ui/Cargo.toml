[package]
name = "fohmixer-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fohmixer touch UI: Leptos CSR, built to WASM by Trunk"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared types (WASM-safe)
fohmixer-proto = { path = "../fohmixer-proto", default-features = false }

# Leptos with CSR (client-side rendering)
leptos = { version = "0.7.8", features = ["csr"] }

# WASM support
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# Web APIs (the panic hook's overlay and report)
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Navigator",
    "Request",
    "RequestInit",
    "Headers",
] }

# Serialization (the panic report)
serde_json = "1.0"
