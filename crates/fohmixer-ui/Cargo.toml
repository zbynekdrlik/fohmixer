[package]
name = "fohmixer-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fohmixer touch UI: Leptos CSR, built to WASM by Trunk"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared types (WASM-safe)
fohmixer-proto = { path = "../fohmixer-proto", default-features = false }

# Leptos with CSR (client-side rendering)
leptos = { version = "0.7.8", features = ["csr"] }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Web APIs: the panic hook's overlay and report, the hub socket and fetch,
# pointer input, the animation loop's style writes, local storage, the text
# measurement that fits a text to its box (Range); the diagnostic reports
# (#26): display mode, screen, errors, the PWA attributes' changes; the
# controls' active touchstart listener and the visual viewport's zoom (#43
# PR G); the Pro-Q 4 screen's binary frames, decoded into a canvas, and a
# card's last picture as a blob URL (#71 PR E)
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "Location",
    "History",
    "Navigator",
    "Performance",
    "Storage",
    "CssStyleDeclaration",
    "DomRect",
    "Node",
    "Range",
    "console",
    "Event",
    "EventTarget",
    "UiEvent",
    "MouseEvent",
    "PointerEvent",
    "KeyboardEvent",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "MediaQueryList",
    "Screen",
    "ErrorEvent",
    "PromiseRejectionEvent",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "AddEventListenerOptions",
    "VisualViewport",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "ImageBitmap",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
] }

# Serialization (the hub protocol, the panic report, the remembered pages)
serde_json = "1.0"
