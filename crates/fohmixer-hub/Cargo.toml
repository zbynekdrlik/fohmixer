[package]
name = "fohmixer-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fohmixer hub: serves the UI and (from S3) connects the Live instances"

[dependencies]
fohmixer-proto = { path = "../fohmixer-proto" }

# Web framework
axum = { version = "0.8", features = ["macros", "json"] }
# Security headers
tower-http = { version = "0.6", features = ["set-header"] }
# Async runtime (signal: the binary's graceful stop)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The UI bundle, embedded at build time (crates/fohmixer-ui/dist)
rust-embed = "8"
mime_guess = "2"

# Errors and logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"
