[package]
name = "fohmixer-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "fohmixer hub: connects the Live instances, fans them out to the clients, serves the UI and the layout"

[dependencies]
fohmixer-proto = { path = "../fohmixer-proto" }

# Web framework (ws: the client WebSocket)
axum = { version = "0.8", features = ["macros", "json", "ws"] }
# Security headers
tower-http = { version = "0.6", features = ["set-header"] }
# Async runtime (signal: the binary's graceful stop)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
# The WebSocket client of the FohMixer scripts (the version axum's ws uses)
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialization (float_roundtrip, #43: a page's times reach the event log and
# its pong exactly as the page sent them; the default parser may miss the
# last bit of a 13-digit ms time)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The config file (no writer: the hub only reads it)
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
# Layout backup names (UTC time, no clock feature: the time comes from std)
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Auth (from iemmixer): JWT, argon2id PIN hashes, random secrets
jsonwebtoken = "9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

# The UI bundle, embedded at build time (crates/fohmixer-ui/dist)
rust-embed = "8"
mime_guess = "2"

# Errors and logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Remote access (#17): the HTTPS listener (axum-server's rustls acceptor),
# rustls on ring (no C toolchain for the PC build, as iemmixer), certificates
# from Let's Encrypt by DNS-01 (instant-acme; rcgen makes the key and the
# CSR), their expiry and names read back (x509-parser), and the hub's own
# HTTPS client (the Access JWKS, the Cloudflare DNS API, cloudflared's
# readiness) on the hyper stack instant-acme already brings.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "rustls-platform-verifier", "tls12", "logging"] }
http-body-util = "0.1"
bytes = "1"
x509-parser = "0.18"

# The PIN pepper is DPAPI-protected on the PC
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Test doubles of #17: a test CA signs the ACME double's CSRs (rcgen); ring
# checks the double's JWS signatures and key thumbprints and reads the
# public half of the test RSA keys (made by `openssl genrsa`: the RSA crate
# carries an unfixed advisory) that sign test Access JWTs
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
ring = "0.17"
# The test certificates' validity (rcgen's time type) and a TLS client for
# the HTTPS listener's tests (the name is sent as SNI; no DNS)
time = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio = { version = "1", features = ["io-util", "process"] }
tempfile = "3"
