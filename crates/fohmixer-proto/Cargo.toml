[package]
name = "fohmixer-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared, WASM-safe types of fohmixer: version info, the client protocol, the layout document"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Date formatting of the build time only: no clock, so the crate stays
# WASM-safe (the UI links it).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
