name: CI

# The iemmixer CI baseline (copied from iemmixer @ 22372bc and adapted, spec
# §5.4): integrity, the Python job for the Live script on SimLive, the
# TouchOSC import tool and the live probe, fmt and clippy (native and wasm32), tests with a
# coverage floor (the hub's tests run real sim/host.py processes), the
# Windows build of the hub (the PC's platform: DPAPI), the Trunk build,
# Playwright E2E in Chromium and WebKit (iPad) with the console guard,
# cargo-deny, gitleaks and the private denylist scan, the version check and
# diff-scoped mutation testing.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  integrity:
    name: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Integrity scan (skips, pins, workflow constructs, force-kill)
        run: python3 scripts/check_integrity.py
      - name: Script self-tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/test_check_disposal_safety.py
      - name: Leptos disposal safety
        run: python3 scripts/check_disposal_safety.py
      - name: Version consistency
        run: python3 scripts/check_version.py

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11 (the Python Live 12 embeds)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: ruff (pinned)
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.16.2
          ruff --version
          ruff check .
      - name: ruff format (script, SimLive, import tool, E2E harness, Cloudflare script)
        run: ruff format --check live-script sim tools e2e/harness scripts/cloudflare
      - name: Test dependencies (websockets test client only; the script itself is stdlib-only)
        run: python -m pip install --quiet -r requirements-dev.txt
      # Each test step runs after a failed one too (the job still fails): one
      # CI cycle reports every failing suite, so a red SimLive test does not
      # hide a red script or importer test.
      - name: SimLive tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m unittest discover -s sim/tests -v 2>&1 | tee "$RUNNER_TEMP/sim-tests.log"
      - name: FohMixer script tests (unit + socket-level against sim/host.py)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m unittest discover -s live-script/tests -v 2>&1 | tee "$RUNNER_TEMP/script-tests.log"
      - name: TouchOSC import tool tests (synthetic .tosc + .als fixtures)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/import-tosc -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/import-tests.log"
      - name: Live probe tests (summary math + runs against sim/host.py)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/live-probe -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/probe-tests.log"
      - name: E2E harness tests (against real sim/host.py processes)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -m unittest discover -s e2e/harness -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/harness-tests.log"
      - name: No skipped or expected-failure tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # unittest marks a skip as "... skipped 'reason'" and counts it as "(skipped=N)";
          # a test NAME may contain the word, so match the markers only.
          if grep -E "\.\.\. (skipped|expected failure|unexpected success)|skipped=|expected failures=" "$RUNNER_TEMP/sim-tests.log" "$RUNNER_TEMP/script-tests.log" "$RUNNER_TEMP/import-tests.log" "$RUNNER_TEMP/probe-tests.log" "$RUNNER_TEMP/harness-tests.log"; then
            echo "::error::a Python test was skipped"; exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Placeholder UI dist (rust-embed needs the folder)
        run: mkdir -p crates/fohmixer-ui/dist && echo placeholder > crates/fohmixer-ui/dist/index.html
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy (native, all targets and features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (UI and protocol for wasm32)
        run: cargo clippy --locked -p fohmixer-ui -p fohmixer-proto --target wasm32-unknown-unknown -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Placeholder UI dist (rust-embed needs the folder)
        run: mkdir -p crates/fohmixer-ui/dist && echo placeholder > crates/fohmixer-ui/dist/index.html
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: UI unit tests (native)
        run: cargo test --locked -p fohmixer-ui --lib
      - name: Tests with line coverage (fohmixer-proto, fohmixer-hub, the tray's decisions) against the floor
        # Runs after a failed UI test step too (the job still fails): one CI
        # cycle reports every failing test.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --no-fail-fast --package fohmixer-proto --package fohmixer-hub --package fohmixer-tray --all-features \
            --json --summary-only --output-path "$RUNNER_TEMP/coverage.json"
          pct="$(jq '.data[0].totals.lines.percent' "$RUNNER_TEMP/coverage.json")"
          floor="$(tr -d '[:space:]' < .github/coverage-floor)"
          echo "line coverage: ${pct}% (floor ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p >= f) }' \
            || { echo "::error::line coverage ${pct}% is below the floor ${floor}%"; exit 1; }

  windows:
    name: windows
    # The hub runs on the Ableton PC (Windows): build and lint it there, run
    # the PIN pepper's tests against real DPAPI (pepper/dpapi.rs is not
    # compiled on Linux, so the mutation gate excludes it), and the hub's
    # host-free integration tests (the layout file handling, auth).
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Placeholder UI dist (rust-embed needs the folder)
        shell: bash
        run: mkdir -p crates/fohmixer-ui/dist && echo placeholder > crates/fohmixer-ui/dist/index.html
      - name: Clippy (hub and tray, Windows-only code included)
        run: cargo clippy --locked -p fohmixer-hub -p fohmixer-tray --all-targets -- -D warnings
      - name: Sealed-secret tests (DPAPI; the PIN pepper, the Cloudflare token)
        run: cargo test --locked -p fohmixer-hub --lib -- "pepper::" "sealed::" "cf_token::"
      - name: Hub API tests on Windows (the layout, auth, the installer's config check; no Live host needed)
        run: cargo test --locked -p fohmixer-hub --test layout --test auth --test config_cli
      - name: PC install self-test (Windows PowerShell 5.1 as on the PC; the debug hub started and stopped by Ctrl-Break, the debug tray started and ended by --exit)
        run: |
          cargo build --locked -p fohmixer-hub -p fohmixer-tray
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fohmixer-pc/Test-Fohmixer.ps1 -HubExe target/debug/fohmixer-hub.exe -TrayExe target/debug/fohmixer-tray.exe
          if ($LASTEXITCODE -ne 0) { throw "Test-Fohmixer.ps1 failed ($LASTEXITCODE)" }

  bundle:
    name: bundle
    # The Windows release bundle for the Ableton PC (S5 design note section 2):
    # only a hosted-CI build of master is ever installed there. The hub is built
    # with the real UI (wasm-dist) embedded, zipped with the FohMixer script, the
    # PC scripts, VERSION and SHA256SUMS by the module the install itself uses,
    # installed once with -NoTask as a check, and uploaded as
    # fohmixer-windows-<version>-<sha> (Install-Fohmixer.ps1 -BundleZip).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [wasm, windows]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-dist
          path: crates/fohmixer-ui/dist
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the hub (release, the real UI embedded) and the tray (release)
        run: cargo build --locked --release -p fohmixer-hub -p fohmixer-tray
      - name: Zip the bundle (hub, tray, FohMixer script, PC scripts, VERSION, SHA256SUMS)
        id: zip
        shell: powershell
        run: |
          Import-Module ./scripts/fohmixer-pc/FohmixerPc.psm1 -Force
          $b = New-FohBundle -RepoRoot $PWD.Path -HubExe target/release/fohmixer-hub.exe -TrayExe target/release/fohmixer-tray.exe -OutDir $env:RUNNER_TEMP -Sha $env:GITHUB_SHA
          Get-Content -LiteralPath (Join-Path $b.stage 'SHA256SUMS')
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "name=$($b.name)`n")
      - name: Install the zip once (-NoTask, a temp data folder, two fake User Libraries and Live preferences)
        shell: powershell
        env:
          BUNDLE: ${{ steps.zip.outputs.name }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bundle-check'
          $band = Join-Path $root 'band\User Library'
          $master = Join-Path $root 'master\User Library'
          New-Item -ItemType Directory -Force -Path $band, $master | Out-Null
          # Each user's Live sets its User Library in Library.cfg (the install checks it, #9).
          foreach ($u in @(@{ lib = $band; prefs = (Join-Path $root 'band\prefs') }, @{ lib = $master; prefs = (Join-Path $root 'master\prefs') })) {
            $dir = Join-Path $u.prefs 'Live 12.2\Preferences'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $project = (Split-Path -Parent $u.lib).Replace('\', '/')
            $cfg = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><Ableton><ContentLibrary><UserLibrary><LibraryProject Id=`"0`">" +
              "<ProjectName Value=`"User Library`" /><ProjectPath Value=`"$project`" /></LibraryProject></UserLibrary></ContentLibrary></Ableton>"
            [IO.File]::WriteAllText((Join-Path $dir 'Library.cfg'), $cfg)
          }
          $zip = Join-Path $env:RUNNER_TEMP "$env:BUNDLE.zip"
          $data = Join-Path $root 'data'
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RUNNER_TEMP "$env:BUNDLE\Install-Fohmixer.ps1") -BundleZip $zip `
            -BandUser band -MasterUser master -DataDir $data -BandUserLibrary $band -MasterUserLibrary $master `
            -BandAbletonPrefs (Join-Path $root 'band\prefs') -MasterAbletonPrefs (Join-Path $root 'master\prefs') -NoTask
          if ($LASTEXITCODE -ne 0) { throw "the install of $zip failed ($LASTEXITCODE)" }
          $version = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "$env:BUNDLE\VERSION") -Raw).Trim()
          foreach ($f in @("app\$version\fohmixer-hub.exe", "app\$version\fohmixer-tray.exe", 'fohmixer-hub.toml')) {
            if (-not (Test-Path -LiteralPath (Join-Path $data $f) -PathType Leaf)) { throw "the install wrote no $f" }
          }
          foreach ($lib in @($band, $master)) {
            if (-not (Test-Path -LiteralPath (Join-Path $lib 'Remote Scripts\FohMixer\version.py') -PathType Leaf)) { throw "no FohMixer copy in $lib" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.zip.outputs.name }}.zip
          retention-days: 30
          if-no-files-found: error

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: trunk@0.21.14
      - name: Build the UI (release)
        working-directory: crates/fohmixer-ui
        run: trunk build --release --locked
      - name: Verify the bundle
        run: |
          set -euo pipefail
          test -f crates/fohmixer-ui/dist/index.html
          ls crates/fohmixer-ui/dist/*.wasm
          test -f crates/fohmixer-ui/dist/manifest.json
          test -f crates/fohmixer-ui/dist/icons/icon-192.png
          test -f crates/fohmixer-ui/dist/icons/icon-512.png
          # The app loader is ours (Trunk.toml pattern_script): every
          # placeholder filled in, and not Trunk's default top-level init.
          grep -q 'WebAssembly.compileStreaming' crates/fohmixer-ui/dist/index.html
          if grep -qE '\{(base|js|wasm)\}' crates/fohmixer-ui/dist/index.html; then
            echo "::error::dist/index.html has an unfilled loader placeholder"
            exit 1
          fi
          if grep -q 'const wasm = await init(' crates/fohmixer-ui/dist/index.html; then
            echo "::error::dist/index.html has Trunk's default loader"
            exit 1
          fi
          # No preload of the WASM module (Trunk.toml pattern_preload): WebKit
          # never matches it to the loader's fetch and warns on the console.
          if grep -oE '<link[^>]*>' crates/fohmixer-ui/dist/index.html | grep 'rel="preload"' | grep -q '\.wasm'; then
            echo "::error::dist/index.html preloads the WASM module"
            exit 1
          fi
          grep -q 'rel="modulepreload"' crates/fohmixer-ui/dist/index.html
          # Spec R5 (#17): the service worker and the wake lock only on the
          # https origin (the emergency plain-http path stays without them),
          # and the worker never stores an answer (network-only).
          grep -q "location.protocol !== 'https:'" crates/fohmixer-ui/dist/index.html
          test -f crates/fohmixer-ui/dist/sw.js
          if grep -qE 'caches\.|cache\.put' crates/fohmixer-ui/dist/sw.js; then
            echo "::error::dist/sw.js uses the Cache Storage (spec R5: the service worker is network-only)"
            exit 1
          fi
          grep -q 'crossorigin="use-credentials"' crates/fohmixer-ui/dist/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-dist
          path: crates/fohmixer-ui/dist/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e
    needs: [wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-dist
          path: crates/fohmixer-ui/dist
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the hub (release, the real UI embedded)
        run: cargo build --locked --release -p fohmixer-hub
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright (Chromium and WebKit)
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Remote access (#17) - a per-run test CA and certificate for foh.e2e.test that both browsers trust, the name in /etc/hosts, the Access test key
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/e2e-remote"
          mkdir -p "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$dir/ca.key" -out "$dir/ca.pem" -days 2 \
            -subj "/CN=fohmixer E2E test CA" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout "$dir/key.pem" -out "$dir/leaf.csr" -subj "/CN=foh.e2e.test"
          printf 'subjectAltName=DNS:foh.e2e.test\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=critical,digitalSignature\n' > "$dir/leaf.ext"
          openssl x509 -req -in "$dir/leaf.csr" -CA "$dir/ca.pem" -CAkey "$dir/ca.key" -CAcreateserial -days 2 -extfile "$dir/leaf.ext" -out "$dir/cert.pem"
          # The name resolves to this runner, as the installer maps it on the Ableton PC.
          echo "127.0.0.1 foh.e2e.test" | sudo tee -a /etc/hosts
          # WebKit (GnuTLS) trusts the system store; Chromium the NSS database.
          sudo cp "$dir/ca.pem" /usr/local/share/ca-certificates/fohmixer-e2e.crt
          sudo update-ca-certificates
          command -v certutil || sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password; fi
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n fohmixer-e2e -i "$dir/ca.pem"
          # The key that signs the test Access assertions (the harness serves its public half).
          openssl genrsa -out "$dir/access.pem" 2048
          echo "E2E_REMOTE_DIR=$dir" >> "$GITHUB_ENV"
      - name: Engineer PIN (random per run, masked)
        run: |
          set -euo pipefail
          # The hub's data folder (secrets, pepper, PIN, layout): a fresh
          # one, outside the tree.
          export FOHMIXER_DATA="$RUNNER_TEMP/hub-data"
          mkdir -p "$FOHMIXER_DATA"
          pin="$(python3 -c 'import secrets; print(f"{secrets.randbelow(10000):04d}")')"
          echo "::add-mask::$pin"
          printf '%s\n' "$pin" | ./target/release/fohmixer-hub pin set-engineer
          echo "E2E_PIN=$pin" >> "$GITHUB_ENV"
      - name: Start the hub with two SimLive hosts (e2e/harness/harness.py)
        env:
          RUST_LOG: info
        run: |
          set -euo pipefail
          # band and master (the real FohMixer script on SimLive, meters at
          # 30 Hz), the hub on the import tool's synthetic layout, the impair
          # proxy in front of the hub (#43, 127.0.0.1:8481: the surface opens
          # through it) and the harness's control API for the tests
          # (127.0.0.1:39190).
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          nohup python3 e2e/harness/harness.py --hub ./target/release/fohmixer-hub \
            --data "$RUNNER_TEMP/hub-data" --link-port 8481 \
            --layout tools/import-tosc/fixtures/expected-layout.json \
            --public-name foh.e2e.test --https-port 8443 \
            --tls-cert "$E2E_REMOTE_DIR/cert.pem" --tls-key "$E2E_REMOTE_DIR/key.pem" \
            --access-team fohmixer-e2e.cloudflareaccess.com --access-aud fohmixer-e2e-aud \
            --access-key "$E2E_REMOTE_DIR/access.pem" \
            --log-dir "$RUNNER_TEMP/e2e-logs" > "$RUNNER_TEMP/e2e-logs/harness.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:39190/health > /dev/null \
              && curl -sf http://127.0.0.1:8480/api/version > /dev/null \
              && curl -sf http://127.0.0.1:8481/api/version > /dev/null \
              && curl -sf https://foh.e2e.test:8443/api/version > /dev/null; then
              echo "harness ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/e2e-logs/harness.log"
          exit 1
      - name: Core dumps off for the test browsers (#9) - a crashed page process is reported at once, not after its dump
        run: |
          set -euo pipefail
          # The test browser's engine crashes now and then (#9). While a
          # crashed page process writes its core dump (15-45 s) it looks like
          # a page that stopped. A piped core_pattern (apport,
          # systemd-coredump) ignores RLIMIT_CORE (core(5)), so a plain
          # pattern first; the Playwright step then sets ulimit -c 0.
          echo "runner core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern=core
      - name: Playwright (Chromium and WebKit iPad, clean console)
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:8480
          # The impair proxy (#43): the Playwright projects' base URL.
          E2E_LINK_URL: http://127.0.0.1:8481
          E2E_HARNESS_URL: http://127.0.0.1:39190
          E2E_HTTPS_URL: https://foh.e2e.test:8443
          E2E_ACCESS_TEAM: fohmixer-e2e.cloudflareaccess.com
          E2E_ACCESS_AUD: fohmixer-e2e-aud
        # NODE_EXTRA_CA_CERTS: the tests' own requests (Node) trust the test CA too.
        run: |
          set -euo pipefail
          ulimit -c 0
          pattern="$(cat /proc/sys/kernel/core_pattern)"
          echo "core dumps: core_pattern ${pattern}, ulimit -c $(ulimit -c)"
          if [ "${pattern#|}" != "$pattern" ]; then
            echo "::error::core_pattern pipes core dumps (${pattern}): a crashed test browser would hang in its dump"
            exit 1
          fi
          E2E_ACCESS_KEY="$E2E_REMOTE_DIR/access.pem" NODE_EXTRA_CA_CERTS="$E2E_REMOTE_DIR/ca.pem" npx playwright test --reporter=list,html
      - name: Kernel crash evidence (#9) - the core pattern, the kernel's segfault and trap lines, the core dumps
        if: failure()
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/e2e-logs/kernel"
          mkdir -p "$dir"
          cat /proc/sys/kernel/core_pattern > "$dir/core_pattern.txt"
          sudo dmesg --ctime | tee "$dir/dmesg.txt" > /dev/null
          status=0
          grep -i -E 'segfault|traps:|general protection' "$dir/dmesg.txt" > "$dir/crashes.txt" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "(no segfault, trap or general protection line in the kernel log)" > "$dir/crashes.txt"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if command -v coredumpctl > /dev/null; then
            # Exit 1 is also "No coredumps found": the output says which.
            status=0
            sudo coredumpctl list --no-pager 2>&1 | tee "$dir/coredumpctl.txt" > /dev/null || status=$?
            echo "(coredumpctl list exit ${status})" >> "$dir/coredumpctl.txt"
          else
            echo "(coredumpctl not installed)" > "$dir/coredumpctl.txt"
          fi
          cat "$dir/core_pattern.txt" "$dir/crashes.txt" "$dir/coredumpctl.txt"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure
          path: |
            e2e/test-results/
            e2e/playwright-report/
            ${{ runner.temp }}/e2e-logs/
          retention-days: 7

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny (advisories, bans, licences, sources)
        run: cargo deny --locked check advisories bans licenses sources

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .'
      - name: Private denylist and commit identities (tree and the commits after the kept legacy history)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # On pull requests scan the PR head's history, not GitHub's synthetic merge commit
          SCAN_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DENYLIST" ]; then
            if [ "$EVENT" = "pull_request" ] && [ "$SAME_REPO" != "true" ]; then
              echo "::error::Fork pull request: the private denylist is unavailable here; a maintainer runs the scan locally before merging (.claude/rules/public-repo-hygiene.md), and the merge push runs it again."
              exit 1
            fi
            echo "::error::The DENYLIST secret is missing."
            exit 1
          fi
          umask 077
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          python3 scripts/denylist_scan.py --denylist "$RUNNER_TEMP/denylist.txt" \
            --identities scripts/allowed-identities.txt --boundary scripts/denylist-boundary.txt \
            --accepted scripts/denylist-accepted.txt --tree HEAD --commits "$SCAN_REV"

  version:
    name: version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Head version greater than master
        run: python3 scripts/check_version.py --base-ref origin/master

  mutants-list:
    name: mutants-list
    # The PR's diff-scoped mutants, and the shard count they need: one shard
    # per MUTANTS_PER_SHARD mutants, so every shard fits its 20-minute budget.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-mutants@27.1.0
      - name: Count the diff-scoped mutants (parsed, not compiled)
        id: count
        env:
          # Mutants one shard tests within its 20-minute budget, setup included:
          # a mutant costs ~150 s of build since #17's TLS/ACME dependencies,
          # two at a time (12 per shard ran over the budget).
          MUTANTS_PER_SHARD: "8"
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          count=0
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then
            cargo mutants --list --in-diff "$RUNNER_TEMP/pr.diff" \
              --package fohmixer-proto --package fohmixer-hub --package fohmixer-ui --package fohmixer-tray > "$RUNNER_TEMP/mutants.txt"
            count="$(wc -l < "$RUNNER_TEMP/mutants.txt")"
            cat "$RUNNER_TEMP/mutants.txt"
          fi
          shards=$(( (count + MUTANTS_PER_SHARD - 1) / MUTANTS_PER_SHARD ))
          if [ "$shards" -lt 1 ]; then shards=1; fi
          matrix="$(python3 -c 'import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$shards")"
          echo "mutants in the diff against ${BASE_REF}: $count; shards at <= $MUTANTS_PER_SHARD per shard: $shards"
          echo "shards=$matrix" >> "$GITHUB_OUTPUT"

  mutation-warmup:
    name: mutation-warmup
    if: github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
      - name: Placeholder UI dist (rust-embed needs the folder)
        run: mkdir -p crates/fohmixer-ui/dist && echo placeholder > crates/fohmixer-ui/dist/index.html
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest@0.9.146
      - name: Build the mutants profile once (the shards restore this cache)
        run: cargo nextest run --locked --cargo-profile mutants --no-run -p fohmixer-proto -p fohmixer-hub -p fohmixer-ui -p fohmixer-tray --all-features --all-targets
      - name: Unmutated tests under the mutants profile (every test's duration; the shards skip the baseline)
        env:
          # A test that fails or times out here unmutated would make every
          # mutant of its package look caught; the durations set the
          # per-package bounds in .config/nextest.toml. One package per run,
          # as cargo-mutants tests a mutant.
          NEXTEST_PROFILE: mutants
        run: |
          set -euo pipefail
          failed=()
          for p in fohmixer-proto fohmixer-hub fohmixer-ui fohmixer-tray; do
            echo "::group::$p"
            cargo nextest run --locked --cargo-profile mutants --no-fail-fast -p "$p" --all-features --all-targets || failed+=("$p")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::unmutated tests fail under the mutants profile in: ${failed[*]}"
            exit 1
          fi

  mutation:
    name: mutation shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    needs: [mutants-list, mutation-warmup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 0-based (cargo-mutants --shard k/n); computed by mutants-list
        shard: ${{ fromJSON(needs.mutants-list.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: mutation
          save-if: false
      - name: Placeholder UI dist (rust-embed needs the folder)
        run: mkdir -p crates/fohmixer-ui/dist && echo placeholder > crates/fohmixer-ui/dist/index.html
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      - name: Warm target (dependencies restored; workspace crates build once, then are copied per job)
        run: cargo nextest run --locked --cargo-profile mutants --no-run -p fohmixer-proto -p fohmixer-hub -p fohmixer-ui -p fohmixer-tray --all-features --all-targets
      - name: Diff-scoped mutants
        env:
          # .config/nextest.toml: stop at the first failing test (fail fast on hangs).
          NEXTEST_PROFILE: mutants
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No Rust changes against ${BASE_REF}: no mutants to test."
            exit 0
          fi
          packages=(--package fohmixer-proto --package fohmixer-hub --package fohmixer-ui --package fohmixer-tray)
          # --timeout: with --baseline=skip cargo-mutants has no measured test
          # time and would allow 300 s per mutant.
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --baseline=skip --timeout 60 --jobs 2 --copy-target=true \
            --shard "${SHARD}/${SHARDS}" "${packages[@]}" --all-features -- --all-targets || status=$?
          case "$status" in
            0|2|3) ;;
            *) echo "::error::cargo-mutants failed to run (exit $status)"; exit "$status" ;;
          esac
          if [ -f mutants.out/missed.txt ] && [ -s mutants.out/missed.txt ]; then
            echo "--- missed mutants ---"
            cat mutants.out/missed.txt
          fi
          # A mutant caught only by a timeout (not a failing test) is tested
          # again, one at a time, with the mutants-recheck profile (60 s per
          # test); a survivor fails the gate (exit 2).
          recheck=0
          python3 scripts/mutants_recheck.py --out mutants.out -- \
            --baseline=skip --timeout 120 --jobs 1 --copy-target=true "${packages[@]}" --all-features -- --all-targets || recheck=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$recheck"
