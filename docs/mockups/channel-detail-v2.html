<!doctype html>
<!-- fohmixer #71 v2: a mockup of the channel detail (a long hold on a strip's ☰ opens one channel full screen: fader, mute, pan, its Pro-Q 4), the full-screen Pro-Q 4 from there, and the EQ lock between engineers; built on the approved #68 views mockup (invented names); the Pro-Q pictures are captured from the PC in the test of 2026-10-09, the track name in them masked; not part of the app. -->
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fohmixer detail kanála</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root {
    color-scheme: dark;
    --bg: #050508;
    --page: #0b0b12;
    --column: #10101a;
    --panel: #1a1a28;
    --panel-mute: #12121b;
    --track: #0a0a14;
    --line: #2a2a44;
    --accent: #4ecdc4;
    --mute: #e63946;
    --band: #4ecdc4;
    --master: #8b7dff;
    --text: #eaeaf0;
    --muted: #9a9ab4;
    --faint: #5c5c78;
    --db: #9be7a8;
    --warm: #f5a623;
    --m-green: #36d67a;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --ui: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
body { display: flex; flex-direction: column; }

/* The mockup bar (not part of the design). */
.mock {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 6px 10px;
    background: #16161f;
    border-bottom: 1px solid #333;
    font-size: 13px;
}
.mock .set { display: flex; gap: 4px; }
.mock button {
    font: 700 12px var(--ui);
    color: var(--muted);
    background: #22222e;
    border: 1px solid #3a3a4a;
    border-radius: 6px;
    padding: 5px 9px;
}
.mock button[aria-pressed="true"] { color: #0b0b12; background: var(--accent); border-color: var(--accent); }
.mock .out { font-family: var(--mono); color: var(--db); }
.mock .note { color: var(--muted); font-size: 12px; }

.stage { flex: 1; position: relative; min-height: 0; }

.screen {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    background: var(--page);
    border-radius: 14px;
    outline: 2px solid #2c2c3a;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr var(--col) 1fr;
    gap: 6px;
    padding: 6px;
}

/* A bank: its strips in one or two lines, each line under a thin row of
   group labels. */
.side { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; }
.line { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.labels { flex: none; height: 14px; display: flex; gap: 4px; }
.label {
    flex: none;
    font: 700 10px/14px var(--display);
    letter-spacing: 0.08em;
    color: var(--muted);
    border-top: 2px solid var(--gc);
    padding: 0 3px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.strips { flex: 1; display: flex; gap: 4px; min-height: 0; }
.strip {
    flex: none;
    width: var(--strip);
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--panel);
    border-radius: 8px;
    padding: 3px;
    min-height: 0;
}
.strip.muted { background: var(--panel-mute); }
.name {
    flex: none;
    height: var(--head);
    border: 0;
    border-radius: 6px;
    background: var(--tc);
    color: #0b0b12;
    font: 700 14px/1 var(--display);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 3px;
}
.strip.muted .name { background: #232333; color: var(--faint); }
.dbl {
    flex: none;
    height: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font: 600 12px/1 var(--mono);
    color: var(--db);
}
.dbl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--m-green); }
.strip.muted .dbl { color: var(--faint); }
.pan { flex: none; height: 16px; border-radius: 8px; background: var(--track); position: relative; }
.pan::after {
    content: "";
    position: absolute;
    left: calc(50% - 6px);
    top: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #8a8aa4;
}
.fz { flex: 1; display: grid; grid-template-columns: 18px 5px 1fr; gap: 3px; padding: 6px 0 4px; min-height: 0; }
.scale, .meter, .fader { position: relative; }
.tick {
    position: absolute;
    right: 0;
    transform: translateY(-50%);
    font: 500 9px/1 var(--mono);
    color: var(--faint);
}
.meter { background: var(--track); border-radius: 2px; overflow: hidden; }
.meter i {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to top, var(--m-green) 70%, #f5d547 88%, #ff4757);
}
.strip.muted .meter i { opacity: 0.25; }
.fader { touch-action: none; }
.fader::before {
    content: "";
    position: absolute;
    left: calc(50% - 2px);
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 2px;
    background: var(--track);
}
.fader .unity { position: absolute; left: 10%; right: 10%; height: 1px; background: #3a3a55; }
.fader .fill {
    position: absolute;
    left: calc(50% - 2px);
    width: 4px;
    bottom: 0;
    background: var(--accent);
    opacity: 0.75;
    border-radius: 2px;
}
.strip.muted .fader .fill { opacity: 0.25; }
.cap {
    position: absolute;
    left: calc(50% - 17px);
    width: 34px;
    height: 22px;
    margin-top: -11px;
    border-radius: 5px;
    background: linear-gradient(#4a4a62, #2c2c40);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
}
.cap::after { content: ""; position: absolute; left: 8px; right: 8px; top: 10px; height: 2px; background: #d8d8e4; }
.strip.held { outline: 2px solid var(--accent); }
/* A strip that always stays visible: a white corner on its name button. */
.strip.pinned .name { position: relative; }
.strip.pinned .name::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    border-style: solid;
    border-width: 0 11px 11px 0;
    border-color: transparent #fff transparent transparent;
    border-top-right-radius: 6px;
}
/* A slot the shown sub-page leaves empty (the strips after it keep their place). */
.strip.blank { background: transparent; border: 1px dashed #24243a; }

/* The control column. */
.column {
    background: var(--column);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: var(--cgap);
    min-height: 0;
    overflow: hidden;
}
.status {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 3px 6px;
    font: 600 10px var(--mono);
    color: var(--muted);
}
.badge { display: inline-flex; align-items: center; gap: 3px; font: 700 11px var(--display); letter-spacing: 0.06em; color: var(--text); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--m-green); }
.count { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.grid { flex: none; display: grid; grid-template-columns: repeat(var(--railcols), 1fr); gap: 4px; }
.grid.three { grid-template-columns: repeat(var(--tabcols), 1fr); }
.btn {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #181826;
    color: var(--muted);
    font: 700 11px/1.05 var(--display);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    height: var(--btn);
    padding: 0 2px;
    overflow: hidden;
}
.btn.on { color: #0b0b12; background: var(--accent); border-color: var(--accent); }
.btn.warm { color: var(--warm); border-color: rgba(245, 166, 35, 0.45); }
.btn.alert { color: var(--mute); border-color: rgba(230, 57, 70, 0.5); }
.cap-title { flex: none; font: 700 9px var(--display); letter-spacing: 0.12em; color: var(--faint); text-align: center; text-transform: uppercase; }
.shifts { flex: none; display: flex; flex-direction: column; gap: 4px; }
.arrows { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 3px; }
.arrows .btn { font-size: 15px; color: var(--text); }
.where { font: 600 10px var(--mono); color: var(--muted); text-align: center; }
.spacer { flex: 1; min-height: 0; }
/* A view's button (a tag group the default view does not place): lit while shown. */
.btn.view { color: var(--text); border-color: #3c3c5c; }
.btn.view.on { color: #0b0b12; background: var(--warm); border-color: var(--warm); }
.grid.dim { opacity: 0.35; }
/* The tag manual's chip on the status line: small, out of the thumbs' way. */
.chip { border: 1px dashed var(--line); border-radius: 4px; padding: 0 4px; background: none; color: var(--muted); font: 700 10px var(--display); letter-spacing: 0.06em; }
/* The rail takes the column's rest and scrolls past it (as page.css's .rail-main). */
.grid.rail { flex: 1 1 auto; min-height: 0; overflow: auto; align-content: start; }
/* A strip in conflict (its label is on another Tuner too): disabled. */
.strip.conflict { position: relative; background: var(--panel-mute); }
.strip.conflict::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 8px;
    border: 2px solid var(--mute);
    background: repeating-linear-gradient(135deg, rgba(230, 57, 70, 0.16) 0 6px, transparent 6px 12px);
    pointer-events: none;
}
.strip.conflict .name { background: #2a1a20; color: #ff8a93; }
.strip.conflict .fader, .strip.conflict .pan { opacity: 0.25; }
.strip.conflict .dbl { color: var(--mute); font: 700 10px/1 var(--display); letter-spacing: 0.06em; }
.strip.conflict .dbl::before { display: none; }
/* A strip whose marker has a problem it still works with (an unknown tag): a yellow corner and the word on its readout line. */
.strip.warn .name { position: relative; }
.strip.warn .name::before {
    content: "!";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: var(--warm);
    color: #0b0b12;
    font: 700 10px/12px var(--ui);
}
.strip.warn .dbl { color: var(--warm); }
/* The tag manual, over the page (closed by its button; the column keeps working under it). */
.manual {
    position: absolute;
    inset: 6px;
    background: rgba(11, 11, 18, 0.97);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    overflow: auto;
    font: 600 14px/1.45 var(--ui);
    color: var(--text);
    z-index: 5;
}
.manual h2 { margin: 0 0 8px; font: 700 20px var(--display); letter-spacing: 0.06em; }
.manual code { font: 600 13px var(--mono); color: var(--db); background: #151522; padding: 1px 5px; border-radius: 4px; }
.manual table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.manual td { border-top: 1px solid #23233a; padding: 5px 6px; vertical-align: top; }
.manual td:first-child { white-space: nowrap; width: 1%; }
.manual .x { float: right; }

/* #71 v2. Pink marks the EQ; the strip loses its pan (the iPad's home bar sits at the bottom edge) and gains ☰ on its readout line. */
:root { --eq: #ff8fd0; --lock: #ffb347; }
.dbl { height: 22px; justify-content: space-between; padding: 0 2px 0 4px; }
.dbl { gap: 2px; }
.dbl .v { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; }
.dbl .v::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--m-green); }
.dbl::before { display: none; }
.burger {
    position: relative;
    flex: none;
    width: 24px;
    height: 20px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #141420;
    color: var(--muted);
    font: 700 13px/18px var(--ui);
    text-align: center;
    overflow: hidden;
    touch-action: none;
}
/* The hold's progress: the button fills while the finger stays. */
.burger i { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: var(--accent); opacity: 0.55; }
.burger.holding i { height: 100%; transition: height 500ms linear; }
.burger span { position: relative; }
.strip.conflict .burger { opacity: 0.3; }
.hint { position: absolute; z-index: 4; transform: translate(-50%, -100%); background: var(--accent); color: #0b0b12; border-radius: 6px; padding: 4px 8px; font: 700 12px var(--ui); white-space: nowrap; pointer-events: none; }

/* The channel detail: one channel over the whole screen. */
.chv { position: absolute; inset: 0; z-index: 6; background: var(--page); display: flex; flex-direction: column; }
.bar {
    flex: none;
    height: var(--bar);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    background: var(--column);
    border-bottom: 1px solid var(--line);
}
.bar .btn { height: 100%; padding: 0 14px; font-size: 14px; color: var(--text); flex: none; }
.bar .btn.exit { color: var(--accent); border-color: rgba(78, 205, 196, 0.55); }
.bar .mid { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; }
.chip-name { flex: none; background: var(--tc); color: #0b0b12; border-radius: 6px; padding: 4px 12px; font: 700 18px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.sub { min-width: 0; font: 600 12px/1.2 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chbody { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--chl) 1fr var(--chr); gap: 10px; padding: 10px; }
.chbody.portrait { grid-template-columns: var(--chl) 1fr; grid-template-rows: auto 1fr; }
.chbody.portrait .eqs { grid-column: 2; grid-row: 2; }
.chbody.portrait .side-r { grid-column: 2; grid-row: 1; }
.chbody.portrait .side-l { grid-row: 1 / span 2; }
.box { background: var(--panel); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.box h4 { margin: 0; font: 700 11px var(--display); letter-spacing: 0.12em; color: var(--faint); text-transform: uppercase; }
/* The big fader: the strip's own drawing, larger. */
.bigmute { flex: none; height: 52px; border: 1px solid var(--line); border-radius: 8px; background: #181826; color: var(--text); font: 700 18px var(--display); letter-spacing: 0.06em; }
.bigmute.muted { background: var(--mute); border-color: var(--mute); color: #fff; }
.bigdb { flex: none; text-align: center; font: 600 22px var(--mono); color: var(--db); }
.bigfz { flex: 1; min-height: 0; display: grid; grid-template-columns: 26px 10px 1fr; gap: 6px; padding: 12px 0 8px; }
.bigfz .tick { font-size: 11px; }
.bigfz .cap { left: calc(50% - 30px); width: 60px; height: 34px; margin-top: -17px; border-radius: 7px; }
.bigfz .cap::after { left: 12px; right: 12px; top: 16px; }
.bigfz .fader::before { left: calc(50% - 3px); width: 6px; }
.bigfz .fader .fill { left: calc(50% - 3px); width: 6px; }
/* The pan: wide, in the middle of the hand's reach, a tap on STRED or a double tap centres it. */
.pan2 { position: relative; height: 64px; border-radius: 10px; background: var(--track); touch-action: none; }
.pan2::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 2px; background: #3a3a55; }
.pan2 .knob { position: absolute; top: 8px; width: 48px; height: 48px; margin-left: -24px; border-radius: 10px; background: linear-gradient(#4a4a62, #2c2c40); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); }
.panrow { display: flex; justify-content: space-between; align-items: center; font: 600 12px var(--mono); color: var(--muted); }
.panval { font: 600 20px var(--mono); color: var(--text); }
.box .btn { height: 40px; font-size: 13px; color: var(--text); }
/* An EQ card: the last picture of this Pro-Q, where it sits, open or locked. */
.eqs { overflow: auto; }
.card { display: flex; flex-direction: column; gap: 8px; background: #12121c; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.card .pic { position: relative; border-radius: 6px; overflow: hidden; background: #000; aspect-ratio: 1349 / 809; max-width: 100%; }
.card .pic img { display: block; width: 100%; height: 100%; }
.card .where { font: 600 12px var(--mono); color: var(--muted); }
.card .open { height: 48px; border-radius: 8px; border: 1px solid var(--eq); background: #2a1626; color: var(--eq); font: 700 16px var(--display); letter-spacing: 0.06em; }
.card.locked .pic img { opacity: 0.3; filter: grayscale(1); }
.card.locked .open { border-color: #3a3a4a; background: #181826; color: var(--faint); }
.lockmsg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 10px; font: 700 15px/1.3 var(--ui); color: var(--lock); }
.lockmsg small { font: 600 12px/1.3 var(--ui); color: var(--muted); }
.lockmsg svg { width: 28px; height: 28px; fill: var(--lock); }
.none { font: 600 14px/1.4 var(--ui); color: var(--muted); }
/* The EQ screen: the live picture under a bar. */
.eqv { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; flex-direction: column; }
.mine { flex: none; display: flex; align-items: center; gap: 4px; font: 600 11px var(--mono); color: var(--eq); }
.mine svg { width: 14px; height: 14px; fill: var(--eq); }
.eqpic { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; }
.eqpic img { position: absolute; display: block; max-width: none; pointer-events: none; }
.touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid var(--eq); background: rgba(255, 143, 208, 0.18); pointer-events: none; }
.turn { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--eq); color: #0b0b12; border-radius: 8px; padding: 8px 12px; font: 700 14px/1.2 var(--ui); text-align: center; width: max-content; max-width: 90%; }
.legend { position: absolute; right: 8px; top: calc(var(--bar) + 8px); z-index: 8; width: min(420px, calc(100% - 16px)); background: rgba(11, 11, 18, 0.96); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font: 600 13px/1.45 var(--ui); color: var(--text); }
.legend h3 { margin: 0 0 6px; font: 700 16px var(--display); letter-spacing: 0.06em; color: var(--eq); }
.legend table { border-collapse: collapse; width: 100%; }
.legend td { border-top: 1px solid #23233a; padding: 4px; vertical-align: top; }
.legend td:first-child { white-space: nowrap; color: var(--eq); width: 1%; padding-right: 10px; }
.legend .tbd { color: var(--warm); }
.mock button.other[aria-pressed="true"] { background: var(--lock); border-color: var(--lock); color: #0b0b12; }
</style>
</head>
<body>
<div class="mock">
    <div class="set" id="devices"></div>
    <button class="other" id="other" aria-pressed="true">Iný zvukár upravuje EQ Vox 3</button>
    <span class="out" id="out"></span>
    <span class="note" id="note"></span>
</div>
<div class="stage" id="stage"><div class="screen" id="screen"></div></div>

    group("HANDS", "var(--master)", [strip("Wireless 1", 1, { pinned: true, db: -9.3 }), strip("Wireless 2", 2, { muted: true, db: -Infinity }), strip("Wireless 3", 3, { muted: true, db: -Infinity }), strip("Wireless 4", 4, { muted: true, db: -Infinity })]),
];
const byName = (n) => [...SUBPAGES, ...ROW0_FIXED, ...ROW1].flatMap((g) => g.strips).find((s) => s.name === n);
const VIEWS = [
    group("TALKSHOW", "var(--warm)", [byName("Wireless 1"), byName("Wireless 2")]),
    group("SOLO", "var(--warm)", [byName("Vox 1"), byName("Playback"), byName("Hall")]),
];
const RAIL = ["Stage", "Stage aut", "Solo vocals", "Solo iem", "Solo podklady", "Reverb", "Voc mic", "Autotune", "Zvukár", "Repro"];
const PAGES = [["Mix", false], ["FOH", true], ["Deck", false]];
const groupOf = (s) => [...SUBPAGES, ...ROW0_FIXED, ...ROW1].find((g) => g.strips.includes(s));

const LAW = [[1, 6], [0.85, 0], [0.7, -6], [0.55, -12], [0.4, -18], [0.302, -24], [0.238, -30], [0.157, -40], [0.036, -60], [0, -Infinity]];
function dbToPos(db) {
    if (db === -Infinity) return 0;
    for (let i = 0; i < LAW.length - 1; i++) {
        const [p0, d0] = LAW[i], [p1, d1] = LAW[i + 1];
        if (db <= d0 && (db >= d1 || d1 === -Infinity)) return d1 === -Infinity ? p1 + (p0 - p1) * 0.5 : p1 + ((db - d1) / (d0 - d1)) * (p0 - p1);
    }
    return 0;
}
function posToDb(p) {
    if (p <= 0.01) return -Infinity;
    for (let i = 0; i < LAW.length - 1; i++) {
        const [p0, d0] = LAW[i], [p1, d1] = LAW[i + 1];
        if (p <= p0 && p >= p1) return d1 === -Infinity ? -60 - (0.036 - p) * 400 : d1 + ((p - p1) / (p0 - p1)) * (d0 - d1);
    }
    return 6;
}
const dbText = (db) => (db === -Infinity ? "-∞" : (db > 0 ? "+" : "") + db.toFixed(1));
const panText = (p) => (p === 0 ? "C" : (p < 0 ? "L " : "R ") + Math.abs(p));

// ch: the open channel detail (a strip). eq: the open EQ screen (which Pro-Q of ch). other: another engineer holds Vox 3's EQ.
const state = { device: "tablet", sub: 0, off: [0, 0], view: null, ch: null, eq: null, legend: false, touch: null, hover: false, other: true, hint: null };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const lockedByOther = (s) => state.other && s.name === "Vox 3";

// The fader drawing (scale, meter, fader), shared by the strip and the channel detail.
function faderZone(s, cls, onMove) {
    const fz = el("div", cls);
    const scale = el("div", "scale");
    for (const d of [6, 0, -6, -12, -18, -24, -30, -40, -60]) {
        const t = el("span", "tick", d > 0 ? "+" + d : String(d));
        t.style.top = (1 - dbToPos(d)) * 100 + "%";
        scale.append(t);
    }
    const meter = el("div", "meter");
    const lvl = el("i");
    lvl.style.height = s.level * 100 + "%";
    meter.append(lvl);
    const fader = el("div", "fader");
    const unity = el("div", "unity");
    unity.style.top = (1 - 0.85) * 100 + "%";
    const fill = el("div", "fill");
    const cap = el("div", "cap");
    const place = () => { const p = dbToPos(s.db); cap.style.top = (1 - p) * 100 + "%"; fill.style.height = p * 100 + "%"; onMove(); };
    place();
    fader.append(unity, fill, cap);
    let drag = null;
    fader.addEventListener("pointerdown", (e) => {
        if (s.conflict) return;
        fader.setPointerCapture(e.pointerId);
        drag = { y: e.clientY, p: dbToPos(s.db), h: fader.getBoundingClientRect().height };
        fz.closest(".strip")?.classList.add("held");
    });
    fader.addEventListener("pointermove", (e) => {
        if (!drag) return;
        s.db = posToDb(Math.min(1, Math.max(0, drag.p - (e.clientY - drag.y) / drag.h)));
        place();
    });
    const end = () => { drag = null; fz.closest(".strip")?.classList.remove("held"); };
    fader.addEventListener("pointerup", end);
    fader.addEventListener("pointercancel", end);
    fz.append(scale, meter, fader);
    return fz;
}

function stripView(s) {
    if (s.blank) return el("div", "strip blank");
    const root = el("div", "strip" + (s.muted ? " muted" : "") + (s.pinned ? " pinned" : "") + (s.conflict ? " conflict" : "") + (s.warn ? " warn" : ""));
    root.style.setProperty("--tc", s.tc);
    const name = el("button", "name", s.name);
    if (!s.conflict) name.addEventListener("pointerdown", () => { s.muted = !s.muted; render(); });
    // The readout line: Live's dB on the left, ☰ on the right. Only a hold on ☰ opens the channel; a tap says so.
    const dbl = el("div", "dbl");
    const v = el("span", "v", s.conflict ? "KONFLIKT" : s.warn ? s.warn : dbText(s.db));
    const burger = el("button", "burger");
    burger.append(el("i"), el("span", "", "☰"));
    burger.setAttribute("aria-label", "Detail kanála (podrž)");
    if (!s.conflict) {
        let timer = null;
        burger.addEventListener("pointerdown", (e) => {
            burger.setPointerCapture(e.pointerId);
            burger.classList.add("holding");
            timer = setTimeout(() => { timer = null; state.ch = s; state.hint = null; render(); }, HOLD_MS);
        });
        const stop = () => {
            burger.classList.remove("holding");
            if (timer) {
                clearTimeout(timer);
                timer = null;
                const r = burger.getBoundingClientRect(), sr = document.getElementById("screen").getBoundingClientRect();
                state.hint = { x: (r.left + r.width / 2 - sr.left) / scaleNow, y: (r.top - sr.top) / scaleNow - 4 };
                render();
                setTimeout(() => { state.hint = null; render(); }, 1200);
            }
        };
        burger.addEventListener("pointerup", stop);
        burger.addEventListener("pointercancel", stop);
    }
    dbl.append(v, burger);
    root.append(name, dbl);
    root.append(faderZone(s, "fz", () => { if (!s.conflict && !s.warn) v.textContent = dbText(s.db); }));
    return root;
}

function slots(row) {
    const tag = (g, s) => ({ ...s, ref: s, group: g.title, gc: g.color });
    if (row === 1) return ROW1.flatMap((g) => g.strips.map((s) => tag(g, s)));
    const region = Array.from({ length: REGION }, () => ({ blank: true }));
    SUBPAGES.forEach((g) => g.strips.forEach((s, i) => { if (s.pinned) region[i] = tag(g, s); }));
    const shown = SUBPAGES[state.sub];
    let at = 0;
    for (const s of shown.strips.filter((x) => !x.pinned)) {
        while (at < REGION && !region[at].blank) at++;
        if (at < REGION) region[at] = tag(shown, s);
    }
    return [...region, ...ROW0_FIXED.flatMap((g) => g.strips.map((s) => tag(g, s)))];
}

function visible(list, room, line) {
    if (list.length <= room) return { shown: list, more: 0 };
    const real = list.filter((s) => !s.blank);
    if (real.length <= room) return { shown: real, more: 0 };
    const pinned = real.filter((s) => s.pinned);
    const others = real.filter((s) => !s.pinned);
    const free = Math.max(0, room - pinned.length);
    const max = Math.max(0, others.length - free);
    state.off[line] = Math.min(Math.max(0, state.off[line]), max);
    const window = new Set(others.slice(state.off[line], state.off[line] + free));
    return { shown: real.filter((s) => s.pinned || window.has(s)), more: max, free, total: others.length };
}

function labelsFor(strips, d) {
    const labels = el("div", "labels");
    const runs = [];
    for (const s of strips) {
        const last = runs[runs.length - 1];
        if (last && last.group === s.group) last.n++;
        else runs.push({ group: s.group, gc: s.gc, n: 1 });
    }
    for (const r of runs) {
        const label = el("div", "label", r.group || "");
        label.style.setProperty("--gc", r.gc || "transparent");
        label.style.width = r.n * d.strip + (r.n - 1) * 4 + "px";
        labels.append(label);
    }
    return labels;
}

function lineHalf(strips, d) {
    const line = el("div", "line");
    const row = el("div", "strips");
    for (const s of strips) row.append(stripView(s.blank ? s : s.ref));
    line.append(labelsFor(strips, d), row);
    return line;
}

function columnView(d, lines) {
    const col = el("div", "column");
    const status = el("div", "status");
    status.append(el("span", "badge", "BAND"), el("span", "badge", "MASTER"), el("span", "count", "0"), el("span", "", "v0.1.0"), el("button", "chip", "ZNAČKY"));
    col.append(status);
    const pages = el("div", "grid three");
    for (const [t, on] of PAGES) pages.append(el("button", "btn" + (on ? " on" : ""), t));
    col.append(pages);
    const subs = el("div", "grid three" + (state.view ? " dim" : ""));
    SUBPAGES.forEach((g, i) => {
        const b = el("button", "btn" + (i === state.sub ? " on" : ""), g.title);
        b.addEventListener("pointerdown", () => { state.sub = i; render(); });
        subs.append(b);
    });
    col.append(subs);
    col.append(el("div", "cap-title", "pohľady"));
    const views = el("div", "grid");
    for (const v of VIEWS) {
        const b = el("button", "btn view" + (state.view === v.title ? " on" : ""), v.title);
        b.addEventListener("pointerdown", () => { state.view = state.view === v.title ? null : v.title; state.off = [0, 0]; render(); });
        views.append(b);
    }
    col.append(views);
    const shifts = el("div", "shifts");
    lines.forEach((v, i) => {
        if (!v.more) return;
        const arrows = el("div", "arrows");
        const back = el("button", "btn", "◀");
        const fwd = el("button", "btn", "▶");
        back.addEventListener("pointerdown", () => { state.off[i] -= v.free; render(); });
        fwd.addEventListener("pointerdown", () => { state.off[i] += v.free; render(); });
        arrows.append(back, el("div", "where", lines.length > 1 ? (i ? "dolný" : "horný") : "posun"), fwd);
        shifts.append(arrows);
    });
    col.append(shifts);
    col.append(el("div", "cap-title", "funkcie"));
    const rail = el("div", "grid rail");
    RAIL.forEach((t, i) => rail.append(el("button", "btn" + (i === 5 || i === 6 ? " warm" : ""), t)));
    col.append(rail, el("button", "btn alert", "TechAlert"));
    return col;
}

function barView(exitText, onExit, s, sub, extra) {
    const bar = el("div", "bar");
    const exit = el("button", "btn exit", exitText);
    exit.addEventListener("pointerdown", onExit);
    const mid = el("div", "mid");
    const chip = el("span", "chip-name", s.name);
    chip.style.setProperty("--tc", s.tc);
    mid.append(chip);
    if (sub) mid.append(el("span", "sub", sub));
    bar.append(exit, mid, ...extra);
    return bar;
}

// The channel detail: this channel only. Fader and mute on the left (the left thumb), its EQs in the middle, the pan on the right (the right thumb).
function channelView(d) {
    const s = state.ch;
    const g = groupOf(s);
    const v = el("div", "chv");
    v.append(barView(d.id === "phone-p" ? "← MIX" : "← SPÄŤ NA MIX", () => { state.ch = null; render(); }, s, d.id === "tablet" ? `${g.title} · band · track 12` : "", []));
    const body = el("div", "chbody" + (d.id === "phone-p" ? " portrait" : ""));
    body.style.setProperty("--chl", d.chl + "px");
    body.style.setProperty("--chr", d.chr + "px");

    const left = el("div", "box side-l");
    left.style.setProperty("--tc", s.tc);
    const mute = el("button", "bigmute" + (s.muted ? " muted" : ""), s.muted ? "MUTE ZAPNUTÝ" : "MUTE");
    mute.addEventListener("pointerdown", () => { s.muted = !s.muted; render(); });
    const db = el("div", "bigdb", dbText(s.db));
    left.append(mute, db, faderZone(s, "bigfz", () => { db.textContent = dbText(s.db); }));

    const eqs = el("div", "box eqs");
    eqs.append(el("h4", "", "EQ"));
    if (s.eqs.length === 0) eqs.append(el("div", "none", "Na tomto tracku nie je Pro-Q 4."));
    s.eqs.forEach((where, i) => {
        const locked = lockedByOther(s);
        const card = el("div", "card" + (locked ? " locked" : ""));
        const pic = el("div", "pic");
        const img = el("img");
        img.src = PROQ_CLEAN;
        img.alt = "Pro-Q 4, posledný obraz";
        pic.append(img);
        if (locked) {
            const m = el("div", "lockmsg");
            m.insertAdjacentHTML("beforeend", LOCK_SVG + "Upravuje ho iný zvukár<small>od 12:41 · uvoľní sa, keď ho zavrie alebo keď jeho zariadenie odpadne</small>");
            pic.append(m);
        }
        card.append(pic, el("div", "where", `Pro-Q 4 · ${where}` + (locked ? "" : " · posledný obraz 12:38")));
        const open = el("button", "open", locked ? "ZAMKNUTÉ" : "OTVORIŤ EQ NA CELÚ OBRAZOVKU");
        if (!locked) open.addEventListener("pointerdown", () => { state.eq = i; state.touch = null; state.hover = false; render(); });
        card.append(open);
        eqs.append(card);
    });

    const right = el("div", "box side-r");
    right.append(el("h4", "", "Panoráma"));
    const pan = el("div", "pan2");
    const knob = el("div", "knob");
    const val = el("span", "panval", panText(s.pan));
    const placePan = () => { knob.style.left = (s.pan + 50) + "%"; val.textContent = panText(s.pan); };
    placePan();
    pan.append(knob);
    let pd = null, lastTap = 0;
    pan.addEventListener("pointerdown", (e) => {
        const now = Date.now();
        if (now - lastTap < 350) { s.pan = 0; placePan(); }
        lastTap = now;
        pan.setPointerCapture(e.pointerId);
        pd = { x: e.clientX, p: s.pan, w: pan.getBoundingClientRect().width };
    });
    pan.addEventListener("pointermove", (e) => { if (!pd) return; s.pan = Math.round(Math.min(50, Math.max(-50, pd.p + ((e.clientX - pd.x) / pd.w) * 100))); placePan(); });
    pan.addEventListener("pointerup", () => { pd = null; });
    const row = el("div", "panrow");
    row.append(el("span", "", "L 50"), val, el("span", "", "R 50"));
    const centre = el("button", "btn", "STRED");
    centre.addEventListener("pointerdown", () => { s.pan = 0; placePan(); });
    right.append(pan, row, centre);

    if (d.id === "phone-p") body.append(left, right, eqs);
    else body.append(left, eqs, right);
    v.append(body);
    return v;
}

function eqView(d) {
    const s = state.ch;
    const where = s.eqs[state.eq];
    const v = el("div", "eqv");
    const help = el("button", "btn", "?");
    help.addEventListener("pointerdown", () => { state.legend = !state.legend; render(); });
    const mine = el("span", "mine");
    mine.insertAdjacentHTML("beforeend", LOCK_SVG + (d.id === "tablet" ? "zamknuté pre teba" : ""));
    v.append(barView(d.id === "phone-p" ? "← KANÁL" : "← SPÄŤ NA KANÁL", () => { state.eq = null; state.legend = false; render(); }, s, d.id === "tablet" ? `Pro-Q 4 · ${where}` : "", [mine, help]));
    const pic = el("div", "eqpic");
    const img = el("img");
    img.alt = "Pro-Q 4, živý obraz z PC";
    img.src = state.hover ? PROQ_HOVER : PROQ_CLEAN;
    const areaW = d.w - 12, areaH = d.h - 12 - d.bar - 1;
    const k = Math.min(areaW / PIC_W, areaH / PIC_H);
    const w = Math.round(PIC_W * k), h = Math.round(PIC_H * k);
    const left = Math.round((areaW - w) / 2), top = d.id === "phone-p" ? 8 : Math.round((areaH - h) / 2);
    Object.assign(img.style, { width: w + "px", height: h + "px", left: left + "px", top: top + "px" });
    pic.append(img);
    const toPic = (e) => {
        const r = pic.getBoundingClientRect();
        const x = ((e.clientX - r.left) / scaleNow - left) / k, y = ((e.clientY - r.top) / scaleNow - top) / k;
        return { x: Math.round(x), y: Math.round(y), in: x >= 0 && y >= 0 && x < PIC_W && y < PIC_H };
    };
    pic.addEventListener("pointerdown", (e) => {
        const p = toPic(e);
        if (!p.in) return;
        state.touch = p;
        state.hover = Math.hypot(p.x - BAND.x, p.y - BAND.y) < 40;
        render();
    });
    if (state.touch) {
        const dot = el("div", "touch");
        dot.style.left = left + state.touch.x * k + "px";
        dot.style.top = top + state.touch.y * k + "px";
        pic.append(dot);
    }
    if (d.id === "phone-p") pic.append(el("div", "turn", "Otoč telefón naležato: Pro-Q je široký. Dvoma prstami sa obraz dá zväčšiť."));
    v.append(pic);
    if (state.legend) {
        const m = el("div", "legend");
        m.insertAdjacentHTML("beforeend", `<h3>DOTYK V PRO-Q</h3>
<table>
<tr><td>1 prst ťuk</td><td>klik (tlačidlá, výber pásma)</td></tr>
<tr><td>1 prst ťah</td><td>ťahanie (pásmo, gombík); myš na PC sa nehýbe</td></tr>
<tr><td>dvojťuk</td><td>dvojklik (nové pásmo v krivke)</td></tr>
<tr><td>podržať</td><td>pravé tlačidlo (menu pásma)</td></tr>
<tr><td>2 prsty hore/dole</td><td>koliesko (Q pásma) <span class="tbd">· ešte overiť na PC</span></td></tr>
<tr><td>2 prsty roztiahnuť</td><td>zväčšiť obraz (telefón)</td></tr>
</table>`);
        v.append(m);
    }
    return v;
}

function render() {
    const d = DEVICES.find((x) => x.id === state.device);
    const screen = document.getElementById("screen");
    screen.replaceChildren();
    screen.style.width = d.w + "px";
    screen.style.height = d.h + "px";
    const sideWidth = (d.w - 12 - d.col - 12) / 2;
    d.strip = Math.floor((sideWidth - (d.fit - 1) * 4) / d.fit);
    for (const [k, v] of [["--col", d.col], ["--strip", d.strip], ["--head", d.head], ["--btn", d.btn], ["--cgap", d.cgap], ["--bar", d.bar]]) screen.style.setProperty(k, v + "px");
    screen.style.setProperty("--railcols", d.railcols);
    screen.style.setProperty("--tabcols", d.tabcols);
    const two = d.h >= 700;
    let content;
    if (state.view) {
        const v = VIEWS.find((x) => x.title === state.view);
        const inView = new Set(v.strips);
        const tag = (g, s) => ({ ...s, ref: s, group: g.title, gc: g.color });
        const pins = [...SUBPAGES, ...ROW0_FIXED, ...ROW1].flatMap((g) => g.strips.filter((s) => s.pinned && !inView.has(s)).map((s) => tag(g, s)));
        content = [[...v.strips.map((s) => tag(v, s)), ...pins]];
    } else {
        content = two ? [slots(0), slots(1)] : [[...slots(0), ...slots(1)]];
    }
    const lines = content.map((list, i) => visible(list, d.fit * 2, i));
    const left = el("div", "side");
    const right = el("div", "side");
    for (const v of lines) {
        const cut = state.view && v.shown.length <= d.fit * 2 ? Math.ceil(v.shown.length / 2) : d.fit;
        left.append(lineHalf(v.shown.slice(0, cut), d));
        right.append(lineHalf(v.shown.slice(cut), d));
    }
    screen.append(left, columnView(d, lines), right);
    if (state.hint) {
        const h = el("div", "hint", "podrž ☰ na detail");
        h.style.left = state.hint.x + "px";
        h.style.top = state.hint.y + "px";
        screen.append(h);
    }
    if (state.ch) screen.append(channelView(d));
    if (state.ch && state.eq !== null) screen.append(eqView(d));
    fitScreen();
    const out = document.getElementById("out");
    const note = document.getElementById("note");
    if (state.ch && state.eq !== null) {
        const t = state.touch;
        out.textContent = t ? `dotyk → klik do Pro-Q na (${t.x}, ${t.y})` : "živý obraz Pro-Q z PC";
        note.textContent = "EQ je zamknutý pre toto zariadenie, kým ho nezavrieš. ← SPÄŤ NA KANÁL zavrie EQ (aj okno na PC) a vráti detail kanála. Ťukni na zelený bod pásma: Pro-Q ukáže jeho okienko (obraz z testu).";
    } else if (state.ch) {
        out.textContent = `detail kanála ${state.ch.name}`;
        note.textContent = "Len tento kanál: fader a mute vľavo, panoráma vpravo (dvojťuk alebo STRED = stred), jeho Pro-Q v strede. Vox 3 ukáže zámok, keď jeho EQ upravuje iný zvukár. ← SPÄŤ NA MIX vráti pôvodný mix.";
    } else {
        out.textContent = `${d.w}×${d.h}: bez panorámy na páse`;
        note.textContent = "Podrž ☰ na riadku s dB (pol sekundy, tlačidlo sa naplní): otvorí detail kanála. Krátky ťuk len poradí. Panoráma už nie je na spodku pásu.";
    }
    for (const b of document.querySelectorAll("[data-device]")) b.setAttribute("aria-pressed", String(b.dataset.device === state.device));
    document.getElementById("other").setAttribute("aria-pressed", String(state.other));
}

let scaleNow = 1;
function fitScreen() {
    const stage = document.getElementById("stage");
    const screen = document.getElementById("screen");
    const d = DEVICES.find((x) => x.id === state.device);
    const s = Math.min(1, (stage.clientWidth - 16) / d.w, (stage.clientHeight - 16) / d.h);
    scaleNow = s;
    screen.style.left = Math.max(8, (stage.clientWidth - d.w * s) / 2) + "px";
    screen.style.top = "8px";
    screen.style.transform = `scale(${s})`;
}

for (const d of DEVICES) {
    const b = el("button", "", d.label);
    b.dataset.device = d.id;
    b.addEventListener("click", () => { state.device = d.id; state.off = [0, 0]; render(); });
    document.getElementById("devices").append(b);
}
document.getElementById("other").addEventListener("click", () => { state.other = !state.other; render(); });
window.addEventListener("resize", render);
render();
</script>
</body>
</html>
