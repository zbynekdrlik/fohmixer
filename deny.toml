[graph]
# The hub runs on the Ableton PC (Windows); the UI and the protocol crate
# also build for the browser.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD", "CDLA-Permissive-2.0", "Unlicense", "MIT-0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# jpeg-encoder (#71 PR E, the Pro-Q 4 screen's frames): MIT OR Apache-2.0
# and the Independent JPEG Group's licence for its DCT, which asks for
# credit in the documentation of a product that ships it (README, LICENSE-IJG).
exceptions = [
  { allow = ["IJG"], crate = "jpeg-encoder" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
