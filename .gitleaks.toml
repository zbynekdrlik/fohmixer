# gitleaks: the default rule set. An allowlist entry needs a comment naming the
# test fixture and why it is not a secret; a real secret is never allowlisted.
[extend]
useDefault = true

# E2E fixture (#17, e2e/tests/remote.spec.ts and the e2e job in ci.yml): the
# Cloudflare Access application AUD tag the test hub is configured with. An
# AUD tag is a public ID even in production (it is in every Access JWT), and
# this one is invented for the test run: not a secret.
[[allowlists]]
description = "the E2E test run's invented Access AUD tag"
regexes = ['''^fohmixer-e2e-aud$''']

# Hub test fixture (#90, crates/fohmixer-hub/src/ableset/tests.rs, a
# WebSocket upgrade written by hand): RFC 6455's own sample
# Sec-WebSocket-Key (section 1.3, base64 of "the sample nonce"). A
# handshake nonce is sent in the clear by design and this one is printed in
# the RFC: not a secret.
[[allowlists]]
description = "RFC 6455's sample Sec-WebSocket-Key in a hub test"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']
